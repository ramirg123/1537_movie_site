<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .poster { fill: #cfe3f7; stroke: #4a78a8; stroke-width: 2; }
    .badge { fill: #fde047; stroke: #92700c; stroke-width: 2; }
    .anchor { fill: #e11d48; }
    .dash { stroke: #e11d48; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .label { fill: #1f2937; font-size: 15px; }
    .title { fill: #1f2937; font-size: 17px; font-weight: 700; }
    .code { fill: #4338ca; font-size: 13px; font-family: Consolas, monospace; }
    .arrowline { stroke: #16a34a; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Panel 1: top/left 50% -->
  <text x="40" y="30" class="title">1. top-[50%] left-[50%]</text>
  <text x="40" y="50" class="label">badge's top-left corner moves to the parent's center</text>

  <rect x="40" y="70" width="260" height="220" rx="6" class="poster" />
  <text x="50" y="95" class="label">poster (relative)</text>

  <!-- center guides -->
  <line x1="170" y1="70" x2="170" y2="290" class="dash" />
  <line x1="40" y1="180" x2="300" y2="180" class="dash" />
  <circle cx="170" cy="180" r="4" class="anchor" />

  <!-- badge whose top-left corner sits at the anchor -->
  <rect x="170" y="180" width="90" height="40" rx="4" class="badge" />
  <text x="186" y="205" class="code">8.9</text>

  <text x="40" y="320" class="code">top: 50%; left: 50%;</text>
  <text x="40" y="340" class="label" font-size="13">(% here is relative to the poster)</text>

  <!-- arrow between panels -->
  <line x1="330" y1="180" x2="400" y2="180" class="arrowline" />

  <!-- Panel 2: translate -50% -->
  <text x="420" y="30" class="title">2. -translate-x-[50%] -translate-y-[50%]</text>
  <text x="420" y="50" class="label">badge shifts back by half of its OWN size</text>

  <rect x="420" y="70" width="260" height="220" rx="6" class="poster" />
  <line x1="550" y1="70" x2="550" y2="290" class="dash" />
  <line x1="420" y1="180" x2="680" y2="180" class="dash" />
  <circle cx="550" cy="180" r="4" class="anchor" />

  <!-- ghost of the un-shifted badge -->
  <rect x="550" y="180" width="90" height="40" rx="4" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- shift arrow -->
  <line x1="595" y1="200" x2="550" y2="180" class="arrowline" />

  <!-- final centered badge -->
  <rect x="505" y="160" width="90" height="40" rx="4" class="badge" />
  <text x="534" y="185" class="code">8.9</text>

  <text x="420" y="320" class="code">translate: -50%, -50%;</text>
  <text x="420" y="340" class="label" font-size="13">(% here is relative to the badge itself)</text>
</svg>
